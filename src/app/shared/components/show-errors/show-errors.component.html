<mat-expansion-panel *ngIf="errorMessages.length > 0">
    <mat-expansion-panel-header>
      <mat-panel-title>Errors details</mat-panel-title>
    </mat-expansion-panel-header>
    <mat-panel-description>
      <ul>
        <li *ngFor="let error of errorMessages">{{ error }}</li>
      </ul>
    </mat-panel-description>
  </mat-expansion-panel>
